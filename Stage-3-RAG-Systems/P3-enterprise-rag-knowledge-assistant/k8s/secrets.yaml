apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-secrets
  namespace: rag-system
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore
  target:
    name: rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: AZURE_OPENAI_API_KEY
      remoteRef:
        key: azure-openai-api-key
    - secretKey: AZURE_OPENAI_ENDPOINT
      remoteRef:
        key: azure-openai-endpoint
    - secretKey: COHERE_API_KEY
      remoteRef:
        key: cohere-api-key
    - secretKey: DATABASE_URL
      remoteRef:
        key: postgres-connection-string
    - secretKey: REDIS_URL
      remoteRef:
        key: redis-connection-string
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: celery-broker-url
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef:
        key: celery-result-backend
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse-secret-key
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse-public-key
