apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
        - name: rag-worker
          image: ragkbregistry.azurecr.io/rag-api:IMAGE_TAG
          command: ["celery"]
          args:
            - "-A"
            - "src.indexing.worker"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "ingest,reindex"
            - "--concurrency=4"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
